name: Windows ZeroTier SSH (6h)

on:
  workflow_dispatch:

jobs:
  windows-6h:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: ⚡ Cài đặt ZeroTier
        shell: pwsh
        run: |
          $uri = "https://download.zerotier.com/dist/ZeroTier%20One.msi"
          $out = "$env:TEMP\ZeroTierOne.msi"
          Write-Host "Downloading ZeroTier..."
          Invoke-WebRequest -Uri $uri -OutFile $out -UseBasicParsing

          Write-Host "Installing ZeroTier (headless)..."
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$out`" /qn /norestart ZTHEADLESS=Yes" -Wait -PassThru -NoNewWindow
          Write-Host "Exit code: $($proc.ExitCode)"

          # Đợi service sẵn sàng
          Start-Sleep -Seconds 8

          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"
          if (Test-Path $ztcli) {
            & $ztcli version
          } else {
            Write-Host "zerotier-cli not found!"
          }

      - name: 🔗 Kết nối ZeroTier
        shell: pwsh
        run: |
          $ZT_NET = "b103a835d2b3a8b0"
          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"

          # Join network
          & $ztcli join $ZT_NET
          Start-Sleep -Seconds 5

          # Hiển thị Node ID
          $info = & $ztcli info
          $NODE_ID = ($info -split '\s+')[2]
          Write-Host ""
          Write-Host "╔═══════════════════════════════════════╗"
          Write-Host "║   ZEROTIER CONNECTION INFO           ║"
          Write-Host "╠═══════════════════════════════════════╣"
          Write-Host "║ 📌 Network: $ZT_NET"
          Write-Host "║ 🆔 Node ID: $NODE_ID"
          Write-Host "║ ⚠️  VÀO my.zerotier.com ĐỂ AUTHORIZE ║"
          Write-Host "╚═══════════════════════════════════════╝"
          Write-Host ""

          # Đợi IP
          Write-Host "⏳ Đợi IP ZeroTier (có thể mất 1-2 phút)..."
          $ZT_IP_ADDR = $null
          for ($i = 1; $i -le 60; $i++) {
            $ipRaw = & $ztcli get $ZT_NET ip4 2>$null
            if ($ipRaw -and $ipRaw -ne "-" -and $ipRaw.Trim() -ne "") {
              $ZT_IP_ADDR = $ipRaw.Trim()
              Write-Host "✅ Đã nhận IP: $ZT_IP_ADDR"
              echo "ZT_IP=$ZT_IP_ADDR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              break
            }
            Write-Host "   Đợi lần $i/60..."
            Start-Sleep -Seconds 2
          }

          if (-not $ZT_IP_ADDR -or $ZT_IP_ADDR -eq "-") {
            Write-Host "⚠️  Chưa nhận được IP, hãy chắc chắn đã authorize node!"
            echo "ZT_IP=CHUA_CO_IP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: 🔧 Cài đặt và cấu hình SSH
        shell: pwsh
        run: |
          # Cài OpenSSH Server
          Write-Host "Installing OpenSSH Server..."
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null

          # Cấu hình SSH
          $sshdConfig = "C:\ProgramData\ssh\sshd_config"
          if (Test-Path $sshdConfig) {
            (Get-Content $sshdConfig) `
              -replace '#?PermitRootLogin.*', 'PermitRootLogin yes' `
              -replace '#?PasswordAuthentication.*', 'PasswordAuthentication yes' `
              -replace '#?PubkeyAuthentication.*', 'PubkeyAuthentication yes' |
              Set-Content $sshdConfig -Encoding utf8
          }

          # Set password cho user runner
          $password = ConvertTo-SecureString "123456" -AsPlainText -Force
          Set-LocalUser -Name "runner" -Password $password -ErrorAction SilentlyContinue
          # Fallback nếu Set-LocalUser không hoạt động
          net user runner 123456

          # Tạo SSH key
          $sshDir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          if (-not (Test-Path "$sshDir\id_ed25519")) {
            ssh-keygen -t ed25519 -f "$sshDir\id_ed25519" -N '""' -q
          }
          Get-Content "$sshDir\id_ed25519.pub" | Add-Content "$sshDir\authorized_keys" -ErrorAction SilentlyContinue
          icacls "$sshDir\authorized_keys" /inheritance:r /grant:r "$env:USERNAME:(R)" | Out-Null

          # Khởi động SSH
          Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic
          Get-Service sshd | Format-List Name, Status, StartType
          Write-Host "✅ SSH đã sẵn sàng"

      - name: 📊 Hiển thị thông tin kết nối
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════╗"
          Write-Host "║     WINDOWS ZEROTIER SSH - 6 GIỜ       ║"
          Write-Host "╠══════════════════════════════════════════╣"
          Write-Host "║ 📡 ZeroTier IP : ${{ env.ZT_IP }}"
          Write-Host "║ 👤 Username    : runner"
          Write-Host "║ 🔑 Password    : 123456"
          Write-Host "║ ⏰ Hết hạn     : $((Get-Date).AddHours(6).ToString('HH:mm dd/MM/yyyy'))"
          Write-Host "╠══════════════════════════════════════════╣"
          Write-Host "║ 📱 SSH từ Termux / bất kỳ đâu:         ║"
          Write-Host "║   ssh runner@${{ env.ZT_IP }}           ║"
          Write-Host "╚══════════════════════════════════════════╝"
          Write-Host ""
          Write-Host "============== SSH PRIVATE KEY =============="
          Get-Content "$env:USERPROFILE\.ssh\id_ed25519" -ErrorAction SilentlyContinue
          Write-Host "============================================="
          Write-Host ""

          # System info
          Write-Host "💻 THÔNG SỐ MÁY ẢO:"
          Write-Host "CPU    : $env:NUMBER_OF_PROCESSORS cores"
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          Write-Host "RAM    : ${ram} GB"
          $disk = Get-PSDrive C
          Write-Host "Disk   : $([math]::Round($disk.Free / 1GB, 1)) GB free"
          Write-Host ""

      - name: 🔄 Keep Alive 6 Giờ
        shell: pwsh
        run: |
          Write-Host "🚀 BẮT ĐẦU PHIÊN 6 GIỜ"
          $endTime = (Get-Date).AddHours(6)
          Write-Host "⏰ Kết thúc: $($endTime.ToString('HH:mm:ss dd/MM/yyyy'))"
          Write-Host ""

          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"

          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            $hours = [int]$remaining.TotalHours
            $minutes = $remaining.Minutes
            $seconds = $remaining.Seconds

            $ztStatus = "❌"
            try {
              $nets = & $ztcli listnetworks 2>$null
              if ($nets -match "OK") { $ztStatus = "✅" }
            } catch {}

            Write-Host ("`r⏱️  Còn: {0:D2}h {1:D2}m {2:D2}s | ZT: {3} | Time: {4} " -f $hours, $minutes, $seconds, $ztStatus, (Get-Date -Format 'HH:mm:ss')) -NoNewline

            Start-Sleep -Seconds 5
          }

          Write-Host ""
          Write-Host "⏰ ĐÃ HẾT 6 GIỜ!"
          Write-Host "🔄 Chạy lại workflow để tiếp tục"
