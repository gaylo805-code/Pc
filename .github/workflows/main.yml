name: Windows ZeroTier RDP (6h)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  windows-6h:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: ⚡ Cài đặt ZeroTier
        shell: pwsh
        run: |
          $uri = "https://download.zerotier.com/dist/ZeroTier%20One.msi"
          $out = "$env:TEMP\ZeroTierOne.msi"
          Write-Host "Downloading ZeroTier..."
          Invoke-WebRequest -Uri $uri -OutFile $out -UseBasicParsing

          Write-Host "Installing ZeroTier (headless)..."
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$out`" /qn /norestart ZTHEADLESS=Yes" -Wait -PassThru -NoNewWindow
          Write-Host "MSI Exit code: $($proc.ExitCode)"

          Start-Sleep -Seconds 10

          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"
          if (Test-Path $ztcli) {
            & $ztcli version
          } else {
            Write-Error "zerotier-cli not found!"
            exit 1
          }

      - name: 🔗 Kết nối ZeroTier
        shell: pwsh
        run: |
          $ZT_NET = "b103a835d2b3a8b0"
          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"

          & $ztcli join $ZT_NET
          Start-Sleep -Seconds 5

          $info = & $ztcli info
          $NODE_ID = ($info -split '\s+')[2]

          Write-Host ""
          Write-Host "╔═══════════════════════════════════════╗"
          Write-Host "║   ZEROTIER CONNECTION INFO           ║"
          Write-Host "╠═══════════════════════════════════════╣"
          Write-Host "║ 📌 Network : $ZT_NET"
          Write-Host "║ 🆔 Node ID : $NODE_ID"
          Write-Host "║ ⚠️  VÀO my.zerotier.com ĐỂ AUTHORIZE ║"
          Write-Host "╚═══════════════════════════════════════╝"
          Write-Host ""

          Write-Host "⏳ Đợi IP ZeroTier (tối đa 120 giây)..."
          $ZT_IP_ADDR = $null
          for ($i = 1; $i -le 60; $i++) {
            $ipRaw = & $ztcli get $ZT_NET ip4 2>$null
            if ($ipRaw -and $ipRaw.Trim() -ne "" -and $ipRaw.Trim() -ne "-") {
              $ZT_IP_ADDR = $ipRaw.Trim()
              Write-Host "✅ Đã nhận IP: $ZT_IP_ADDR"
              "ZT_IP=$ZT_IP_ADDR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              break
            }
            Write-Host "   Đợi lần $i/60..."
            Start-Sleep -Seconds 2
          }

          if (-not $ZT_IP_ADDR) {
            Write-Host "⚠️  Chưa nhận được IP — hãy authorize node trên my.zerotier.com rồi đợi thêm"
            "ZT_IP=CHUA_CO_IP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: 🖥️ Bật Remote Desktop (RDP)
        shell: pwsh
        run: |
          $username = $env:USERNAME
          Write-Host "Current user: $username"

          $password = "Runner@123456"

          # Set password
          net user $username $password

          # Bật Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          # Mở firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-In" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue

          Restart-Service TermService -Force -ErrorAction SilentlyContinue

          Write-Host "✅ Remote Desktop đã được bật"
          Write-Host "Username : $username"
          Write-Host "Password : $password"

          "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 📦 Xuất thông tin kết nối
        shell: pwsh
        run: |
          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"
          $info = & $ztcli info
          $NODE_ID = ($info -split '\s+')[2]
          $ZT_IP = $env:ZT_IP
          if ($ZT_IP -eq "CHUA_CO_IP" -or [string]::IsNullOrWhiteSpace($ZT_IP)) { $ZT_IP = "" }
          $conn = @{
            repository  = $env:GITHUB_REPOSITORY
            run_id      = $env:GITHUB_RUN_ID
            run_url     = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            zerotier_net = "b103a835d2b3a8b0"
            node_id     = $NODE_ID
            zt_ip       = $ZT_IP
            rdp_user    = $env:USERNAME
            rdp_pass    = $env:RDP_PASS
            rdp_port    = 3389
          } | ConvertTo-Json
          $conn | Out-File -FilePath connection.json -Encoding utf8

      - name: 📤 Upload thông tin kết nối
        uses: actions/upload-artifact@v4
        with:
          name: connection-info
          path: connection.json
          overwrite: true
          if-no-files-found: warn

      - name: 📊 Hiển thị thông tin kết nối
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════╗"
          Write-Host "║      WINDOWS ZEROTIER RDP - 6 GIỜ            ║"
          Write-Host "╠══════════════════════════════════════════════╣"
          Write-Host "║ 📡 ZeroTier IP : ${{ env.ZT_IP }}"
          Write-Host "║ 👤 Username    : ${{ env.RDP_USER }}"
          Write-Host "║ 🔑 Password    : ${{ env.RDP_PASS }}"
          Write-Host "║ 🔌 Port        : 3389"
          Write-Host "║ ⏰ Tổng thời gian: 21600 giây (6 tiếng)     ║"
          Write-Host "╠══════════════════════════════════════════════╣"
          Write-Host "║ 📱 Cách kết nối:                            ║"
          Write-Host "║   1. Authorize node trên my.zerotier.com    ║"
          Write-Host "║   2. Mở Remote Desktop Connection           ║"
          Write-Host "║   3. Gõ: ${{ env.ZT_IP }}                   ║"
          Write-Host "║   4. Login bằng username/password ở trên    ║"
          Write-Host "╚══════════════════════════════════════════════╝"
          Write-Host ""

          Write-Host "💻 THÔNG SỐ MÁY ẢO:"
          Write-Host "CPU  : $env:NUMBER_OF_PROCESSORS cores"
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          Write-Host "RAM  : ${ram} GB"
          $disk = Get-PSDrive C
          Write-Host "Disk : $([math]::Round($disk.Free / 1GB, 1)) GB free"
          Write-Host ""

      - name: 🔄 Keep Alive Chống Timeout (21600s)
        shell: pwsh
        run: |
          Write-Host "🚀 BẮT ĐẦU ĐẾM NGƯỢC 21600 GIÂY (6 TIẾNG)"

          $totalSeconds = 21600
          $startTime = Get-Date
          $endTime = $startTime.AddSeconds($totalSeconds)

          Write-Host "⏰ Thời gian kết thúc: $($endTime.ToString('HH:mm:ss dd/MM/yyyy'))"
          Write-Host ""

          $ztcli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"
          $counter = 0

          $statusUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/connection.json"
          $apiHdr = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $lastIp = $null

          function Push-Status([string]$ip, [string]$nodeId, [string]$userName, [string]$pass) {
            $conn = @{
              repository   = $env:GITHUB_REPOSITORY
              run_id       = $env:GITHUB_RUN_ID
              run_url      = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              zerotier_net = "b103a835d2b3a8b0"
              node_id      = $nodeId
              zt_ip        = $ip
              rdp_user     = $userName
              rdp_pass     = $pass
              rdp_port     = 3389
              ts           = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            } | ConvertTo-Json
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($conn))
            $body = @{ message = "status"; content = $b64; branch = "runner-status" }
            try {
              $sha = (Invoke-RestMethod -Method Get -Uri "$statusUri`?ref=runner-status" -Headers $apiHdr -ErrorAction Stop).sha
              $body.sha = $sha
            } catch { }
            try {
              Invoke-RestMethod -Method Put -Uri $statusUri -Headers $apiHdr -ContentType "application/json" `
                -Body ([Text.Encoding]::UTF8.GetBytes(($body | ConvertTo-Json -Compress))) -ErrorAction Stop | Out-Null
              Write-Host "📡 Đã đẩy trạng thái: IP=$ip"
            } catch {
              Write-Host "⚠️ Push status lỗi: $($_.Exception.Message)"
            }
          }

          while ((Get-Date) -lt $endTime) {
            $currentSpan = $endTime - (Get-Date)
            $remainingSeconds = [math]::Floor($currentSpan.TotalSeconds)

            if ($remainingSeconds -le 0) { break }

            $ztStatus = "❌"
            try {
              $nets = & $ztcli listnetworks 2>$null
              if ($nets -match "OK") { $ztStatus = "✅" }
            } catch {}

            $ip = ""
            try {
              $ipRaw = & $ztcli get b103a835d2b3a8b0 ip4 2>$null
              if ($ipRaw -and $ipRaw.Trim() -ne "" -and $ipRaw.Trim() -ne "-") { $ip = $ipRaw.Trim() }
            } catch {}
            $nodeId = ""
            try {
              $inf = & $ztcli info 2>$null
              if ($inf) { $nodeId = ($inf -split '\s+')[2] }
            } catch {}

            $counter++
            Write-Host "[$counter] ⏳ Còn lại: $remainingSeconds giây | ZeroTier: $ztStatus IP:${ip} | Lúc: $(Get-Date -Format 'HH:mm:ss')"

            if ($ip -ne $lastIp) {
              Push-Status -ip $ip -nodeId $nodeId -userName $env:USERNAME -pass $env:RDP_PASS
              $lastIp = $ip
            }

            Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "⏰ ĐÃ HOÀN TẤT 21600 GIÂY (6 TIẾNG)!"
          
